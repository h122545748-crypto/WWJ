<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><文舞集>簽到</title>
  <style>
    *{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background-color:#121212;color:#fff;margin:0;padding:15px;display:flex;justify-content:center;align-items:center;min-height:100vh}
    .card-container{background:#1e1e1e;padding:24px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:500px;width:100%;text-align:center;position:relative}
    h2{font-size:28px;margin-top:0;color:#ff007f}
    .btn-main{background:linear-gradient(135deg,#007bff,#00d2ff);color:#fff;border:none;padding:20px;font-size:24px;font-weight:700;border-radius:16px;cursor:pointer;width:100%;margin:15px 0;box-shadow:0 4px 15px rgba(0,123,255,.4);transition:all .2s}
    .btn-main.scanning{background:linear-gradient(135deg,#dc3545,#ff6b6b);box-shadow:0 4px 15px rgba(220,53,69,.4)}
    .status-display{margin-top:15px;padding:25px;border-radius:16px;font-size:22px;font-weight:700;line-height:1.6;text-align:left;min-height:220px;display:flex;flex-direction:column;justify-content:center;word-break:break-all}
    .theme-standby{background-color:#2a2a2a;color:#aaa;border:2px dashed #555;text-align:center}
    .theme-waiting{background-color:#1a2332;color:#00d2ff;border:3px solid #00d2ff;animation:breathing-glow 2.5s infinite ease-in-out}
    @keyframes breathing-glow{0%,100%{opacity:.5;border-color:rgba(0,210,255,.4);box-shadow:0 0 5px rgba(0,210,255,.2)}50%{opacity:1;border-color:#00d2ff;box-shadow:0 0 20px rgba(0,210,255,.8)}}
    .theme-loading{background-color:#332b00;color:#ffeb3b;position:relative;border:4px solid transparent;border-image:linear-gradient(90deg,#ffcc00,#332b00,#ffcc00,#332b00) 1;animation:marquee-border 1.2s linear infinite}
    @keyframes marquee-border{0%{border-image:linear-gradient(0deg,#ffcc00 0%,#332b00 50%,#ffcc00 100%) 1}25%{border-image:linear-gradient(90deg,#ffcc00 0%,#332b00 50%,#ffcc00 100%) 1}50%{border-image:linear-gradient(180deg,#ffcc00 0%,#332b00 50%,#ffcc00 100%) 1}75%{border-image:linear-gradient(270deg,#ffcc00 0%,#332b00 50%,#ffcc00 100%) 1}100%{border-image:linear-gradient(360deg,#ffcc00 0%,#332b00 50%,#ffcc00 100%) 1}}
    .theme-success{background-color:#004d20;color:#00ff66;border:3px solid #00ff66}
    .theme-error{background-color:#5a0000;color:#ff4d4d;border:3px solid #ff4d4d}
    .theme-admin{background-color:#4a0072;color:#e040fb;border:3px solid #e040fb}
    .highlight-val{font-size:32px;font-weight:900;color:#fff;text-decoration:underline}
    .warn-alert{display:inline-block;font-weight:900;color:#ff3333;text-shadow:0 0 10px rgba(255,0,0,.8);animation:blink-animation .8s infinite alternate;background-color:rgba(255,0,0,.2);padding:2px 8px;border-radius:8px}
    @keyframes blink-animation{0%{opacity:1;transform:scale(1)}100%{opacity:.3;transform:scale(1.02)}}
    .history-box{margin-top:15px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2);font-size:15px;color:#e0e0e0;font-weight:400}
    .history-title{font-size:16px;font-weight:700;color:#ffeb3b;margin-bottom:6px}
    .history-item{padding:2px 0;font-family:monospace}
    .confirm-box{display:none;background:#332b00;border:3px solid #ffcc00;padding:20px;border-radius:16px;margin-top:15px;text-align:center}
    .confirm-btn-group{display:flex;gap:12px;margin-top:15px}
    .btn-confirm-no,.btn-confirm-yes{flex:1;color:#fff;border:none;padding:18px;font-size:22px;font-weight:700;border-radius:12px;cursor:pointer}
    .btn-confirm-yes{background:#28a745}
    .btn-confirm-no{background:#dc3545}
    .admin-panel{display:none;margin-top:20px;padding:20px;background:#2c2c2c;border-radius:16px;border:2px solid #e040fb;text-align:left}
    .admin-panel h3{color:#e040fb;margin-top:0;font-size:22px}
    .form-group{margin-bottom:12px}
    .form-group label{display:block;font-size:16px;margin-bottom:5px;color:#ccc}
    .form-group input,.form-group select{width:100%;padding:12px;font-size:18px;border-radius:8px;border:none;background:#333;color:#fff}
    .btn-admin-act{background:#e040fb;color:#fff;border:none;padding:12px;font-size:18px;font-weight:700;border-radius:8px;width:100%;margin-top:10px;cursor:pointer}
    .btn-danger{background:#d32f2f!important}
    .btn-info{background:#0288d1!important}
    .btn-warning{background:#f57c00!important}
    .btn-close-admin{background:#666;margin-top:15px}
    .admin-section{margin-top:15px;padding-top:15px;border-top:1px solid #444}
    .log-list{max-height:250px;overflow-y:auto;background:#1e1e1e;border-radius:8px;padding:10px;margin-top:10px;font-size:15px}
    .log-item{padding:8px 0;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
    .btn-refund{background:#ff9800;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer}
    .switch-container{display:flex;align-items:center;justify-content:space-between;background:#222;padding:10px 14px;border-radius:8px;margin-top:15px}
    .switch{position:relative;display:inline-block;width:50px;height:26px}
    .switch input{opacity:0;width:0;height:0}
    .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#555;transition:.3s;border-radius:26px}
    .slider:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background-color:#fff;transition:.3s;border-radius:50%}
    input:checked+.slider{background-color:#d32f2f}
    input:checked+.slider:before{transform:translateX(24px)}
    .idle-warning-box{display:none;position:fixed;top:20px;left:50%;transform:translateX(-50%);width:90%;max-width:460px;background:#d32f2f;color:#fff;padding:15px;border-radius:12px;box-shadow:0 5px 20px rgba(255,0,0,.6);z-index:9999;text-align:center;font-weight:700;animation:pulse-warn 1s infinite alternate}
    @keyframes pulse-warn{0%{transform:translateX(-50%) scale(1)}100%{transform:translateX(-50%) scale(1.03)}}
  </style>
</head>
<body>

<div id="idleWarningBox" class="idle-warning-box">
  ⚠️ 檢測到閒置！系統即將於 <span id="idleCountdownSec" style="font-size:26px;text-decoration:underline">10</span> 秒後自動退出管理者模式！<br>
  <span style="font-size:13px;opacity:.9">(請點擊畫面任意處以繼續使用)</span>
</div>

<div class="card-container">
  <h2>&lt;文舞集&gt;簽到</h2>
  <button id="scanBtn" class="btn-main">開啟感應打卡</button>

  <div id="displayWindow" class="status-display theme-standby">點擊上方按鈕開始感應...</div>

  <div id="confirmBox" class="confirm-box">
    <div id="confirmMsg" style="font-size:20px;color:#ffeb3b;font-weight:700"></div>
    <div class="confirm-btn-group">
      <button id="btnConfirmYes" class="btn-confirm-yes">是 (再扣 1 點)</button>
      <button id="btnConfirmNo" class="btn-confirm-no">否 (取消)</button>
    </div>
  </div>

  <div id="adminPanel" class="admin-panel">
    <h3>👑 管理者控制台 (已暫停扣款)</h3>
    <p style="font-size:16px;color:#fff;margin-bottom:5px">當前感應卡號：<b id="adminTargetCard" style="color:#00d2ff;font-size:20px">請靠卡...</b></p>
    <p id="cardStatusBadge" style="font-size:14px;color:#ffeb3b;font-weight:700;margin-top:0"></p>

    <div class="admin-section">
      <button class="btn-admin-act btn-info" onclick="fetchRecentLogs()">📋 查詢 1 小時內簽到名單</button>
      <div id="recentLogsContainer" style="display:none;margin-top:10px">
        <div id="recentLogsList" class="log-list"></div>
      </div>
    </div>

    <div class="admin-section">
      <button class="btn-admin-act btn-warning" onclick="toggleReplaceMode()">🔄 進入卡片遺失換卡模式</button>
      <div id="replaceSection" class="replace-box" style="display:none;background:#332200;border:2px solid #ff9800;padding:15px;border-radius:12px;margin-top:10px">
        <h4 style="color:#ff9800;margin-top:0">💳 遺失換卡模式步驟：</h4>
        <p style="font-size:14px;color:#ddd;margin:5px 0">1. 請將<b>【全新新卡】</b>靠卡感應<br>當前感應新卡號：<b id="newCardDisplay" style="color:#00d2ff">未讀取</b></p>
        <div class="form-group" style="margin-top:10px">
          <label>2. 請輸入要換卡的會員姓名：</label>
          <div style="display:flex;gap:8px">
            <input type="text" id="replaceSearchName" placeholder="輸入姓名...">
            <button onclick="searchReplaceUser()" style="width:100px;background:#00b0ff;border:none;color:#fff;border-radius:8px;font-weight:700">查詢</button>
          </div>
        </div>
        <div id="replaceUserPreview" style="display:none;background:#222;padding:10px;border-radius:8px;margin-top:10px;font-size:15px"></div>
        <button id="btnConfirmReplace" class="btn-admin-act btn-danger" style="display:none;margin-top:10px" onclick="executeCardReplace()">3. 確定更換（廢除舊卡）</button>
      </div>
    </div>

    <div id="sectionNewCard" class="admin-section" style="display:none">
      <h4>✨ 建立新會員資料</h4>
      <div class="form-group">
        <label>使用者姓名：</label>
        <input type="text" id="newUserName" placeholder="例如：王小明">
      </div>
      <div class="form-group">
        <label>卡片類別：</label>
        <select id="newCardType">
          <option value="一般">一般會員</option>
          <option value="VIP">VIP 會員</option>
          <option value="體驗">體驗學員</option>
          <option value="管理者">管理者</option>
        </select>
      </div>
      <div class="form-group">
        <label>初始點數 (預設 10 點)：</label>
        <input type="number" id="newCardPoints" value="10">
      </div>
      <div class="form-group">
        <label>使用期限 (預設今日 +100 天)：</label>
        <input type="date" id="newCardExpiry">
      </div>
      <button class="btn-admin-act" onclick="submitNewCard()">確認開卡 / 建立帳號</button>
    </div>

    <div id="sectionAddPoints" class="admin-section" style="display:none">
      <h4>🎟️ 點數儲值與展延</h4>
      <div class="form-group">
        <label>展延到期日 (預設：剩餘點數×10天 + 100天)：</label>
        <input type="date" id="addPointExpiry">
      </div>
      <button class="btn-admin-act" style="background:#00c853;margin-bottom:8px" onclick="submitAddPoints(10)">+ 增加 10 點</button>
      <button class="btn-admin-act" style="background:#00b0ff;margin-bottom:12px" onclick="submitAddPoints(12)">+ 增加 12 點</button>
      <div class="switch-container">
        <span style="font-size:14px;color:#ff8a80;font-weight:700">解鎖刪除卡片功能：</span>
        <label class="switch">
          <input type="checkbox" id="toggleDeleteUnlock" onchange="handleToggleDelete(this)">
          <span class="slider"></span>
        </label>
      </div>
      <button id="btnDeleteCard" class="btn-admin-act btn-danger" style="display:none;margin-top:10px" onclick="submitDeleteCard()">🗑️ 確定刪除此卡片資料</button>
    </div>

    <button class="btn-admin-act btn-close-admin" onclick="closeAdminPanel()">退出管理者模式 (恢復打卡扣點)</button>
  </div>
</div>

<script>
  const GAS_WEB_APP_URL="https://script.google.com/macros/s/AKfycbzpFR7wxpoBoL74g_nUx_j88lN50VcKEbKW9h5_6gtalOqVzI3K-Ap0MYgsnUnbv0NPIg/exec";
  const scanBtn=document.getElementById("scanBtn"),displayWindow=document.getElementById("displayWindow"),adminPanel=document.getElementById("adminPanel"),adminTargetCard=document.getElementById("adminTargetCard"),cardStatusBadge=document.getElementById("cardStatusBadge"),confirmBox=document.getElementById("confirmBox"),confirmMsg=document.getElementById("confirmMsg"),sectionNewCard=document.getElementById("sectionNewCard"),sectionAddPoints=document.getElementById("sectionAddPoints"),replaceSection=document.getElementById("replaceSection"),idleWarningBox=document.getElementById("idleWarningBox"),idleCountdownSec=document.getElementById("idleCountdownSec");
  let ndefController=null,isScanning=!1,isAdminMode=!1,isReplaceMode=!1,currentScannedCardForAdmin="",pendingCardId="",targetReplaceUser=null,autoResetTimer=null,adminIdleTimer=null,adminCountdownInterval=null,countdownSeconds=10,audioCtx=null;

  function initAudio(){audioCtx||(audioCtx=new(window.AudioContext||window.webkitAudioContext)),"suspended"===audioCtx.state&&audioCtx.resume()}
  function playSoundSuccess(){if(initAudio(),audioCtx){const t=audioCtx.createOscillator(),e=audioCtx.createGain();t.type="sine",t.frequency.setValueAtTime(880,audioCtx.currentTime),e.gain.setValueAtTime(.3,audioCtx.currentTime),e.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.25),t.connect(e),e.connect(audioCtx.destination),t.start(),t.stop(audioCtx.currentTime+.25)}}
  function playSoundError(){if(initAudio(),audioCtx){const t=audioCtx.currentTime,e=audioCtx.createOscillator(),n=audioCtx.createGain();e.type="sawtooth",e.frequency.setValueAtTime(220,t),n.gain.setValueAtTime(.3,t),n.gain.exponentialRampToValueAtTime(.01,t+.15),e.connect(n),n.connect(audioCtx.destination),e.start(t),e.stop(t+.15);const o=audioCtx.createOscillator(),a=audioCtx.createGain();o.type="sawtooth",o.frequency.setValueAtTime(180,t+.2),a.gain.setValueAtTime(.3,t+.2),a.gain.exponentialRampToValueAtTime(.01,t+.4),o.connect(a),a.connect(audioCtx.destination),o.start(t+.2),o.stop(t+.4)}}
  function resetAdminIdleTimer(){isAdminMode&&(adminIdleTimer&&clearTimeout(adminIdleTimer),adminCountdownInterval&&clearInterval(adminCountdownInterval),idleWarningBox.style.display="none",adminIdleTimer=setTimeout((()=>{startIdleCountdown()}),30e3))}
  function startIdleCountdown(){countdownSeconds=10,idleCountdownSec.innerText=countdownSeconds,idleWarningBox.style.display="block",playSoundError(),adminCountdownInterval=setInterval((()=>{countdownSeconds--,idleCountdownSec.innerText=countdownSeconds,playSoundError(),countdownSeconds<=0&&(clearInterval(adminCountdownInterval),idleWarningBox.style.display="none",closeAdminPanel(),alert("⏱️ 管理者模式已超過 40 秒未操作，系統已自動退出！"))}),1e3)}
  ["click","touchstart","mousemove","keydown","scroll"].forEach((t=>{window.addEventListener(t,(()=>{isAdminMode&&resetAdminIdleTimer()}),{passive:!0})}));
  function calcFutureDate(t){const e=new Date;e.setDate(e.getDate()+t);return[e.getFullYear(),(""+(e.getMonth()+1)).padStart(2,"0"),(""+e.getDate()).padStart(2,"0")].join("-")}
  function calcRechargeExpiry(t){return calcFutureDate(10*(Number(t)||0)+100)}
  function setDisplay(t,e){displayWindow.className=`status-display ${e}`,displayWindow.innerHTML=t}
  function maskName(t){if(!t)return"";const e=Array.from(t);return e.length>1&&(e[1]="♥"),e.join("")}
  function resetAutoResetTimer(){autoResetTimer&&clearTimeout(autoResetTimer),isAdminMode||(autoResetTimer=setTimeout((()=>{confirmBox.style.display="none",pendingCardId="",isScanning?setDisplay("📡 NFC 讀取中...<br>請將卡片靠近手機背面","theme-waiting"):setDisplay("點擊上方按鈕開始感應...","theme-standby")}),30e3))}
  scanBtn.addEventListener("click",(async()=>{initAudio(),isScanning?stopNfcScan():startNfcScan()}));
  function pauseNfcScan(){ndefController&&(ndefController.abort(),ndefController=null)}
  function resumeNfcScanWithCooldown(t=2e3){autoResetTimer&&clearTimeout(autoResetTimer),resetAutoResetTimer();const e=isAdminMode||isReplaceMode?500:t;setTimeout((()=>{isScanning&&!ndefController&&restartNfcListener()}),e)}
  async function restartNfcListener(){try{ndefController=new AbortController;const t=new NDEFReader;await t.scan({signal:ndefController.signal}),t.addEventListener("readingerror",(()=>{pauseNfcScan(),setDisplay("❌ 讀取失敗，請重新靠卡一次","theme-error"),playSoundError(),resumeNfcScanWithCooldown(3e3)})),t.addEventListener("reading",(async({serialNumber:t})=>{if(pauseNfcScan(),cardId=t.replace(/:/g,"").toUpperCase(),isAdminMode){if(resetAdminIdleTimer(),currentScannedCardForAdmin=cardId,adminTargetCard.innerText=cardId,document.getElementById("toggleDeleteUnlock").checked=!1,document.getElementById("btnDeleteCard").style.display="none",isReplaceMode)return document.getElementById("newCardDisplay").innerText=cardId,playSoundSuccess(),void resumeNfcScanWithCooldown(500);setDisplay("🔍 正在查詢卡片狀態...","theme-loading");try{const t=await safeFetch({action:"checkCard",cardId:cardId});if(!t)return void resumeNfcScanWithCooldown(500);if("exists"===t.status){sectionNewCard.style.display="none",sectionAddPoints.style.display="block";const e=calcRechargeExpiry(t.points);document.getElementById("addPointExpiry").value=e,cardStatusBadge.innerText=`⚠️ 既有學員：${t.name}（剩餘 ${t.points} 點，原到期日 ${t.expiryDate||"無"}）`;let n="";n=t.logsAfterRecharge&&t.logsAfterRecharge.length>0?t.logsAfterRecharge.map((t=>`<div class="history-item">🕒 ${t.time} <span style="color:#00ff66;">(剩 ${t.remainingPoints} 點)</span></div>`)).join(""):`<div class="history-item" style="color:#aaa;">儲值後尚無進場打卡紀錄</div>`,setDisplay(`
                <div style="text-align: center;">
                  姓名：<b>${t.name}</b><br>
                  點數：<b>${t.points}</b> 點<br>
                  使用期限：${t.expiryDate||"無期限"}
                </div>
                <div class="history-box" style="margin-top:15px; text-align:left; max-height:160px; overflow-y:auto;">
                  <div class="history-title" style="color:#00d2ff;">💰 最近一次儲值/開卡時間：</div>
                  <div class="history-item" style="margin-bottom:8px; font-weight:bold;">${t.lastRechargeTime}</div>
                  <div class="history-title" style="color:#ffeb3b;">📌 儲值後進場打卡紀錄：</div>
                  ${n}
                </div>
              `,"theme-admin"),playSoundSuccess()}else sectionNewCard.style.display="block",sectionAddPoints.style.display="none",document.getElementById("newCardPoints").value=10,document.getElementById("newCardExpiry").value=calcFutureDate(100),cardStatusBadge.innerText="✨ 此為全新的空白卡片，可建立新資料",setDisplay(`👑 <b>全新卡片</b><br>卡號：<b>${cardId}</b><br>請於下方面板填寫資料開卡。`,"theme-admin"),playSoundSuccess()}catch(t){setDisplay("❌ 查詢卡片狀態失敗："+t.message,"theme-error"),playSoundError()}return void resumeNfcScanWithCooldown(500)}processDeduct(cardId,!1)}))}catch(t){console.error("NFC 自動重啟失敗:",t)}}
  async function startNfcScan(){if(!("NDEFReader"in window))return setDisplay("⚠️ 瀏覽器不支援 Web NFC！<br>請確認使用 Android 上的 Chrome 瀏覽器","theme-error"),void playSoundError();isScanning=!0,scanBtn.innerText="停止感應打卡",scanBtn.classList.add("scanning"),setDisplay("📡 NFC 讀取中...<br>請將卡片靠近手機背面","theme-waiting"),await restartNfcListener()}
  async function safeFetch(t){try{const e=await fetch(GAS_WEB_APP_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(t)});if(!e.ok)return setDisplay(`⚠️ <b>伺服器回應異常 (${e.status})</b>`,"theme-error"),playSoundError(),null;const n=e.headers.get("content-type");return n&&n.includes("application/json")?await e.json():(setDisplay("⚠️ <b>Google 伺服器連線繁忙</b><br>請稍後 3 秒重新靠卡感應。","theme-error"),playSoundError(),null)}catch(t){return setDisplay("❌ <b>連線失敗：</b><br>請檢查網路連線後重試。","theme-error"),playSoundError(),null}}
  async function processDeduct(t,e=!1){confirmBox.style.display="none",setDisplay(`💳 掃描卡號：<b>${t}</b><br>⏳ <b>資料處理中，請勿重複刷卡...</b>`,"theme-loading");const n=await safeFetch({action:"deduct",cardId:t,isForce:e});if(n)if("success"===n.status){playSoundSuccess();let e=`<span class="highlight-val">${n.remainingPoints}</span> 次`;n.remainingPoints<=3&&(e=`<span class="warn-alert">${n.remainingPoints} 次 ⚠️ 點數即將用完！</span>`);let o=`<span class="highlight-val">${n.expiryDate}</span>`;if(n.expiryDate&&"無期限"!==n.expiryDate){const t=new Date;t.setHours(0,0,0,0);const e=new Date(n.expiryDate),s=Math.ceil((e-t)/864e5);if(s<10){const t=s<=0?"已過期！":`剩 ${s} 天`;o=`<span class="warn-alert">${n.expiryDate} (${t})</span>`}}let s="";if(n.recent5Logs&&n.recent5Logs.length>0){const t=n.recent5Logs.map((t=>`<div class="history-item">🕒 ${t}</div>`)).join("");s=`
          <div class="history-box">
            <div class="history-title">📅 最近 5 次打卡紀錄：</div>
            ${t}
          </div>
        `}const a=maskName(n.name);setDisplay(`
        <div style="font-size:28px; color:#00ff66; text-align:center; margin-bottom:10px;">🎉 歡迎報到</div>
        <div style="font-size:36px; text-align:center; margin-bottom:15px; color:#fff;">${a}</div>
        🎟️ 剩餘點數：${e}<br>
