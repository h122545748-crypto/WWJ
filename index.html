<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><文舞集> 課程打卡簽到</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card-container {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      max-width: 500px;
      width: 100%;
      text-align: center;
      position: relative;
    }
    h2 { font-size: 26px; margin-top: 0; color: #ff007f; }
    
    .day-badge {
      display: inline-block;
      background: #333;
      color: #ffeb3b;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    /* 課程選擇與滑動開關區塊 */
    .course-switch-section {
      text-align: left;
      margin-bottom: 15px;
      background: #2a2a2a;
      padding: 12px 15px;
      border-radius: 12px;
      border: 1px solid #444;
    }
    .section-title {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .course-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #383838;
    }
    .course-item:last-child { border-bottom: none; }
    .course-info { display: flex; flex-direction: column; gap: 2px; }
    .course-name { font-size: 16px; font-weight: bold; color: #fff; }
    .course-sub { font-size: 13px; color: #00d2ff; }

    /* 滑動開關 Switch 樣式 */
    .switch {
      position: relative;
      display: inline-block;
      width: 52px;
      height: 28px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #555; transition: .3s; border-radius: 28px;
    }
    .slider:before {
      position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #00c853; }
    input:checked + .slider:before { transform: translateX(24px); }

    .status-display {
      margin-top: 15px;
      padding: 20px;
      border-radius: 16px;
      font-size: 20px;
      font-weight: bold;
      line-height: 1.5;
      text-align: left;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      word-break: break-all;
    }

    .theme-standby { background-color: #2a2a2a; color: #aaa; border: 2px dashed #555; text-align: center; }
    .theme-waiting {
      background-color: #1a2332;
      color: #00d2ff;
      border: 3px solid #00d2ff;
      animation: breathing-glow 2.5s infinite ease-in-out;
    }
    @keyframes breathing-glow {
      0% { opacity: 0.5; border-color: rgba(0, 210, 255, 0.4); box-shadow: 0 0 5px rgba(0, 210, 255, 0.2); }
      50% { opacity: 1; border-color: rgba(0, 210, 255, 1); box-shadow: 0 0 20px rgba(0, 210, 255, 0.8); }
      100% { opacity: 0.5; border-color: rgba(0, 210, 255, 0.4); box-shadow: 0 0 5px rgba(0, 210, 255, 0.2); }
    }

    .theme-loading {
      background-color: #332b00;
      color: #ffeb3b;
      border: 3px solid #ffcc00;
    }

    .theme-success { background-color: #004d20; color: #00ff66; border: 3px solid #00ff66; }
    .theme-error { background-color: #5a0000; color: #ff4d4d; border: 3px solid #ff4d4d; }
    .theme-admin { background-color: #4a0072; color: #e040fb; border: 3px solid #e040fb; }

    .highlight-val { font-size: 28px; font-weight: 900; color: #ffffff; text-decoration: underline; }

    .admin-panel {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #2c2c2c;
      border-radius: 16px;
      border: 2px solid #e040fb;
      text-align: left;
    }
    .btn-admin-act {
      background: #e040fb; color: white; border: none; padding: 10px; font-size: 16px; font-weight: bold; border-radius: 8px; width: 100%; margin-top: 10px; cursor: pointer;
    }
    .btn-close-admin { background: #666; margin-top: 15px; }
  </style>
</head>
<body>

<div class="card-container">
  <h2>&lt;文舞集&gt; 課程打卡簽到</h2>
  <div id="dayBadge" class="day-badge">📅 正在讀取今日課程...</div>

  <div class="course-switch-section">
    <div class="section-title">請現場人員選擇並開啟今日上課課程：</div>
    <div id="courseListContainer">載入今日上架課程中...</div>
  </div>

  <div id="displayWindow" class="status-display theme-standby">
    請先開啟上方欲打卡的課程開關...
  </div>

  <div id="adminPanel" class="admin-panel">
    <h3 style="color:#e040fb; margin:0 0 10px 0;">👑 管理者模式</h3>
    <p>當前感應卡號：<b id="adminTargetCard" style="color:#00d2ff;">請靠卡...</b></p>
    <button class="btn-admin-act btn-close-admin" onclick="closeAdminPanel()">退出管理者模式</button>
  </div>
</div>

<script>
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzou8bhecGqckgDOeM0dihDKurQlOQ6CURl2vFeZupA8NcTfMoULBWhLpnhMnurXviX/exec";

  let todayCourses = [];
  let selectedCourseObj = null;
  let ndefController = null;
  let isScanning = false;
  let isAdminMode = false;

  document.addEventListener("DOMContentLoaded", () => {
    fetchTodayCourses();
  });

  async function fetchTodayCourses() {
    try {
      const res = await fetch(`${GAS_WEB_APP_URL}?action=getTodayCourses`);
      const data = await res.json();
      
      if (data.status === "success") {
        document.getElementById('dayBadge').innerText = `📅 今天是 ${data.dayOfWeek}（開放 ${data.courses.length} 堂課）`;
        todayCourses = data.courses;
        renderCourseSwitches(todayCourses);
      } else {
        document.getElementById('courseListContainer').innerHTML = "<div style='color:#ff4d4d;'>讀取課程失敗</div>";
      }
    } catch(e) {
      document.getElementById('courseListContainer').innerHTML = "<div style='color:#ff4d4d;'>網路連線失敗</div>";
    }
  }

  function renderCourseSwitches(courses) {
    const container = document.getElementById('courseListContainer');
    if (!courses || courses.length === 0) {
      container.innerHTML = "<div style='color:#aaa; text-align:center;'>本日無排定上架課程</div>";
      return;
    }

    let html = "";
    courses.forEach((c, index) => {
      html += `
        <div class="course-item">
          <div class="course-info">
            <span class="course-name">${c.courseName}</span>
            <span class="course-sub">👤 ${c.teacher}｜⏰ ${c.timeInfo}</span>
          </div>
          <label class="switch">
            <input type="checkbox" class="course-toggle" data-index="${index}" onchange="handleToggleChange(this, ${index})">
            <span class="slider"></span>
          </label>
        </div>
      `;
    });
    container.innerHTML = html;
  }

  function handleToggleChange(currentCheckbox, index) {
    const allToggles = document.querySelectorAll('.course-toggle');

    if (currentCheckbox.checked) {
      // 確保同一時間只有一個開關被開啟
      allToggles.forEach(t => {
        if (t !== currentCheckbox) t.checked = false;
      });

      selectedCourseObj = todayCourses[index];
      startNfcScan();
    } else {
      selectedCourseObj = null;
      stopNfcScan();
    }
  }

  async function startNfcScan() {
    if (!('NDEFReader' in window)) {
      setDisplay("⚠️ 瀏覽器不支援 Web NFC！<br>請使用 Android 上的 Chrome", "theme-error");
      return;
    }

    isScanning = true;
    setDisplay(`📡 感應啟動中...<br>請學員將卡片靠近手機感應打卡<br><br>📌 目前課程：<b>${selectedCourseObj.courseName}</b>`, "theme-waiting");
    await restartNfcListener();
  }

  function stopNfcScan() {
    if (ndefController) {
      ndefController.abort();
      ndefController = null;
    }
    isScanning = false;
    setDisplay("請先開啟上方欲打卡的課程開關...", "theme-standby");
  }

  async function restartNfcListener() {
    try {
      ndefController = new AbortController();
      const ndef = new NDEFReader();
      await ndef.scan({ signal: ndefController.signal });

      ndef.addEventListener("reading", async ({ serialNumber }) => {
        pauseNfcScan();
        const cardId = serialNumber.replace(/:/g, '').toUpperCase();
        await processDeductAndCheckIn(cardId);
      });
    } catch (e) {
      console.error("NFC 開啟失敗", e);
    }
  }

  function pauseNfcScan() {
    if (ndefController) {
      ndefController.abort();
      ndefController = null;
    }
  }

  async function processDeductAndCheckIn(cardId) {
    setDisplay(`💳 讀取卡號：<b>${cardId}</b><br>⏳ 打卡扣點處理中...`, "theme-loading");

    try {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action: "deductAndCheckIn",
          cardId: cardId,
          courseName: selectedCourseObj.courseName,
          teacher: selectedCourseObj.teacher
        })
      });

      const result = await response.json();

      if (result.status === "success") {
        setDisplay(`
          <div style="font-size:24px; color:#00ff66; text-align:center;">🎉 簽到成功！</div>
          <div style="font-size:32px; text-align:center; color:#fff;">${result.name}</div>
          📚 課程：<b>${selectedCourseObj.courseName}</b><br>
          🎟️ 剩餘點數：<span class="highlight-val">${result.remainingPoints}</span> 次
        `, "theme-success");
      } else {
        setDisplay(`❌ 打卡失敗：<br>${result.message}`, "theme-error");
      }
    } catch(e) {
      setDisplay("❌ 連線異常，請重新靠卡", "theme-error");
    }

    setTimeout(() => {
      if (isScanning && selectedCourseObj) restartNfcListener();
    }, 2500);
  }

  function setDisplay(html, themeClass) {
    const el = document.getElementById('displayWindow');
    el.className = `status-display ${themeClass}`;
    el.innerHTML = html;
  }
</script>

</body>
</html>
