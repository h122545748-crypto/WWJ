<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><文舞集>簽到系統</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card-container {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      max-width: 500px;
      width: 100%;
      text-align: center;
      position: relative;
    }
    h2 { font-size: 26px; margin-top: 0; color: #ff007f; margin-bottom: 10px; }
    
    .btn-main {
      background: linear-gradient(135deg, #007bff, #00d2ff);
      color: white;
      border: none;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      border-radius: 16px;
      cursor: pointer;
      width: 100%;
      margin: 15px 0 10px 0;
      box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
      transition: all 0.2s;
    }
    .btn-main.scanning {
      background: linear-gradient(135deg, #dc3545, #ff6b6b);
      box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
    }

    /* 課程選擇區塊樣式 */
    .course-section {
      background: #282828;
      border: 1px solid #444;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 15px;
      text-align: left;
    }
    .course-section-title {
      font-size: 14px;
      color: #ffeb3b;
      font-weight: bold;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .course-list-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
    }
    .course-switch-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e1e1e;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #333;
    }
    .course-info {
      display: flex;
      flex-direction: column;
    }
    .course-title-text {
      font-size: 15px;
      font-weight: bold;
      color: #ffffff;
    }
    .course-sub-text {
      font-size: 12px;
      color: #aaa;
    }

    /* 滑動開關 (Toggle Switch) 樣式 */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #555; transition: .3s; border-radius: 24px;
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #00e676; }
    input:checked + .slider:before { transform: translateX(20px); }

    .status-display {
      margin-top: 10px;
      padding: 20px;
      border-radius: 16px;
      font-size: 20px;
      font-weight: bold;
      line-height: 1.5;
      text-align: left;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      word-break: break-all;
    }

    .theme-standby { background-color: #2a2a2a; color: #aaa; border: 2px dashed #555; text-align: center; }
    .theme-waiting {
      background-color: #1a2332;
      color: #00d2ff;
      border: 3px solid #00d2ff;
      animation: breathing-glow 2.5s infinite ease-in-out;
    }
    @keyframes breathing-glow {
      0% { opacity: 0.5; border-color: rgba(0, 210, 255, 0.4); box-shadow: 0 0 5px rgba(0, 210, 255, 0.2); }
      50% { opacity: 1; border-color: rgba(0, 210, 255, 1); box-shadow: 0 0 20px rgba(0, 210, 255, 0.8); }
      100% { opacity: 0.5; border-color: rgba(0, 210, 255, 0.4); box-shadow: 0 0 5px rgba(0, 210, 255, 0.2); }
    }
    .theme-loading {
      background-color: #332b00;
      color: #ffeb3b;
      position: relative;
      border: 4px solid #ffcc00;
    }
    .theme-success { background-color: #004d20; color: #00ff66; border: 3px solid #00ff66; }
    .theme-error { background-color: #5a0000; color: #ff4d4d; border: 3px solid #ff4d4d; }
    .theme-admin { background-color: #4a0072; color: #e040fb; border: 3px solid #e040fb; }

    .highlight-val { font-size: 28px; font-weight: 900; color: #ffffff; text-decoration: underline; }

    .history-box {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 14px;
      color: #e0e0e0;
      font-weight: normal;
    }
    .history-title { font-size: 15px; font-weight: bold; color: #ffeb3b; margin-bottom: 4px; }
    .history-item { padding: 2px 0; font-family: monospace; }

    .confirm-box {
      display: none;
      background: #332b00;
      border: 3px solid #ffcc00;
      padding: 20px;
      border-radius: 16px;
      margin-top: 15px;
      text-align: center;
    }
    .confirm-btn-group { display: flex; gap: 12px; margin-top: 15px; }
    .btn-confirm-yes { flex: 1; background: #28a745; color: white; border: none; padding: 15px; font-size: 20px; font-weight: bold; border-radius: 12px; cursor: pointer; }
    .btn-confirm-no { flex: 1; background: #dc3545; color: white; border: none; padding: 15px; font-size: 20px; font-weight: bold; border-radius: 12px; cursor: pointer; }
    
    .admin-panel {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: #2c2c2c;
      border-radius: 16px;
      border: 2px solid #e040fb;
      text-align: left;
    }
    .admin-panel h3 { color: #e040fb; margin-top: 0; font-size: 20px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 14px; margin-bottom: 5px; color: #ccc; }
    .form-group input, .form-group select {
      width: 100%; padding: 10px; font-size: 16px; border-radius: 8px; border: none; background: #333; color: white;
    }
    .btn-admin-act {
      background: #e040fb; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; width: 100%; margin-top: 10px; cursor: pointer;
    }
    .btn-danger { background: #d32f2f !important; }
    .btn-info { background: #0288d1 !important; }
    .btn-warning { background: #f57c00 !important; }
    .btn-close-admin { background: #666; margin-top: 15px; }
    .admin-section { margin-top: 15px; padding-top: 15px; border-top: 1px solid #444; }

    .log-list {
      max-height: 200px;
      overflow-y: auto;
      background: #1e1e1e;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      font-size: 14px;
    }
    .log-item {
      padding: 6px 0;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-refund {
      background: #ff9800; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
    }

    .idle-warning-box {
      display: none;
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 460px;
      background: #d32f2f;
      color: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(255,0,0,0.6);
      z-index: 9999;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="idleWarningBox" class="idle-warning-box">
    ⚠️ 檢測到閒置！系統即將於 <span id="idleCountdownSec" style="font-size: 24px; text-decoration: underline;">10</span> 秒後退出管理者模式！<br>
    <span style="font-size: 12px; opacity: 0.9;">(點擊畫面任意處即可繼續使用)</span>
  </div>

  <div class="card-container">
    <h2>文舞集 簽到扣點系統</h2>

    <div class="course-section">
      <div class="course-section-title">
        <span>📅 今日上架課程清單</span>
        <span id="todayWeekdayStr" style="color:#aaa; font-weight:normal;">載入中...</span>
      </div>
      <div id="courseListContainer" class="course-list-box">
        <div style="color:#888; text-align:center; padding:10px;">正在獲取今日課程...</div>
      </div>
    </div>

    <button id="btnScan" class="btn-main" onclick="toggleScan()">🚀 點擊啟動感應</button>

    <div id="statusDisplay" class="status-display theme-standby">
      請點擊上方按鈕開始感應打卡
    </div>

    <div id="confirmBox" class="confirm-box">
      <div id="confirmMsg" style="font-size: 20px; font-weight: bold; color: #ffeb3b; line-height: 1.5;"></div>
      <div class="confirm-btn-group">
        <button class="btn-confirm-yes" onclick="confirmDeduct(true)">確定扣點</button>
        <button class="btn-confirm-no" onclick="confirmDeduct(false)">取消</button>
      </div>
    </div>

    <div id="adminPanel" class="admin-panel">
      <h3>⚙️ 管理者功能面板</h3>
      <p style="color: #bbb; font-size: 14px;">當前卡號：<b id="adminCardId" style="color:#fff;"></b></p>
      
      <div class="admin-section">
        <h4 style="color:#00d2ff; margin:0 0 10px 0;">1. 開立新卡片 / 綁定學員</h4>
        <div class="form-group">
          <label>學員姓名：</label>
          <input type="text" id="regName" placeholder="請輸入姓名">
        </div>
        <div class="form-group">
          <label>卡片類型：</label>
          <select id="regType">
            <option value="一般學員">一般學員</option>
            <option value="VIP學員">VIP學員</option>
            <option value="管理者">管理者</option>
          </select>
        </div>
        <div class="form-group">
          <label>初始點數：</label>
          <input type="number" id="regPoints" value="10">
        </div>
        <div class="form-group">
          <label>到期日期：</label>
          <input type="date" id="regExpiry">
        </div>
        <button class="btn-admin-act" onclick="submitAddCard()">新增 / 更新卡片</button>
      </div>

      <div class="admin-section">
        <h4 style="color:#00ff66; margin:0 0 10px 0;">2. 學員儲值加點</h4>
        <div class="form-group">
          <label>增加點數：</label>
          <input type="number" id="addPointsAmount" placeholder="例如：10">
        </div>
        <div class="form-group">
          <label>新到期日 (留空保持原樣)：</label>
          <input type="date" id="addExpiryDate">
        </div>
        <button class="btn-admin-act btn-info" onclick="submitAddPoints()">確定儲值加點</button>
      </div>

      <div class="admin-section">
        <h4 style="color:#ffb74d; margin:0 0 10px 0;">3. 舊卡換新卡 (移轉點數)</h4>
        <p style="color:#aaa; font-size:12px; margin-top:-5px;">當前感應的卡將做為【新卡】，請選取要移轉的舊卡學員：</p>
        <div class="form-group">
          <label>搜尋舊卡學員姓名：</label>
          <div style="display:flex; gap:8px;">
            <input type="text" id="searchOldName" placeholder="輸入姓名">
            <button style="width:80px; background:#555; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;" onclick="searchOldUser()">搜尋</button>
          </div>
        </div>
        <div class="form-group">
          <select id="selectOldUser">
            <option value="">-- 請先搜尋學員 --</option>
          </select>
        </div>
        <button class="btn-admin-act btn-warning" onclick="submitReplaceCard()">執行換卡與轉移</button>
      </div>

      <div class="admin-section">
        <h4 style="color:#ffeb3b; margin:0 0 10px 0;">4. 最近簽到紀錄與辦理退點</h4>
        <button style="background:#444; color:#fff; border:none; padding:8px 12px; border-radius:6px; font-weight:bold; cursor:pointer;" onclick="fetchRecentLogs()">🔄 重新整理紀錄</button>
        <div id="recentLogsContainer" class="log-list">
          <div style="color:#888; text-align:center;">點擊上方按鈕獲取紀錄...</div>
        </div>
      </div>

      <div class="admin-section">
        <h4 style="color:#ff4d4d; margin:0 0 10px 0;">5. 危險操作：刪除當前卡片</h4>
        <div class="switch-container" style="margin-top:0; margin-bottom:10px;">
          <span style="font-size:14px; color:#ff8888; font-weight:bold;">解鎖刪除按鈕：</span>
          <label class="switch">
            <input type="checkbox" id="toggleDeleteUnlock" onchange="toggleDeleteButton()">
            <span class="slider"></span>
          </label>
        </div>
        <button id="btnDeleteCard" class="btn-admin-act btn-danger" style="opacity:0.4; cursor:not-allowed;" disabled onclick="submitDeleteCard()">刪除此卡片</button>
      </div>

      <button class="btn-admin-act btn-close-admin" onclick="closeAdminPanel()">退出管理者模式</button>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwP7gS5W8g4fU2QyKvh87W8a6Z7yP_GAS_URL/exec"; 

    let isScanning = false;
    let nfcReader = null;
    let pendingCardId = "";
    let todayCoursesData = [];

    let isAdminMode = false;
    let currentScannedCardForAdmin = "";
    let adminIdleTimer = null;
    let adminCountdownInterval = null;
    let idleSecondsLeft = 60;
    const IDLE_LIMIT = 60;

    const btnScan = document.getElementById('btnScan');
    const statusDisplay = document.getElementById('statusDisplay');
    const confirmBox = document.getElementById('confirmBox');
    const confirmMsg = document.getElementById('confirmMsg');
    const adminPanel = document.getElementById('adminPanel');
    const idleWarningBox = document.getElementById('idleWarningBox');

    // 頁面載入後自動獲取今日課程
    window.onload = function() {
      fetchTodayCourses();
    };

    // 獲取今日星期與相對應上架課程
    async function fetchTodayCourses() {
      const weekdays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
      const today = new Date();
      const currentWeekday = weekdays[today.getDay()];
      document.getElementById('todayWeekdayStr').innerText = `(${currentWeekday})`;

      const result = await safeFetch({ action: "getTodayCourses" });
      const container = document.getElementById('courseListContainer');
      container.innerHTML = "";

      if (result && result.status === "success" && result.courses && result.courses.length > 0) {
        todayCoursesData = result.courses;
        result.courses.forEach((c, index) => {
          const item = document.createElement('div');
          item.className = 'course-switch-item';
          item.innerHTML = `
            <div class="course-info">
              <span class="course-title-text">${c.courseName}</span>
              <span class="course-sub-text">師資：${c.teacher} ｜ 時間：${c.timeInfo}</span>
            </div>
            <label class="switch">
              <input type="checkbox" class="course-toggle-checkbox" data-index="${index}" checked>
              <span class="slider"></span>
            </label>
          `;
          container.appendChild(item);
        });
      } else {
        container.innerHTML = `<div style="color:#aaa; text-align:center; padding:10px;">今天（${currentWeekday}）無排定上架課程</div>`;
      }
    }

    // 取得當前勾選開啟的課程清單
    function getSelectedCourses() {
      const checkboxes = document.querySelectorAll('.course-toggle-checkbox');
      const selected = [];
      checkboxes.forEach(cb => {
        if (cb.checked) {
          const idx = parseInt(cb.getAttribute('data-index'), 10);
          if (todayCoursesData[idx]) {
            selected.push(todayCoursesData[idx]);
          }
        }
      });
      return selected;
    }

    // 重設閒置計時器
    function resetAdminIdleTimer() {
      if (!isAdminMode) return;
      idleSecondsLeft = IDLE_LIMIT;
      idleWarningBox.style.display = 'none';

      if (adminIdleTimer) clearTimeout(adminIdleTimer);
      if (adminCountdownInterval) clearInterval(adminCountdownInterval);

      adminCountdownInterval = setInterval(() => {
        idleSecondsLeft--;
        if (idleSecondsLeft <= 10 && idleSecondsLeft > 0) {
          idleWarningBox.style.display = 'block';
          document.getElementById('idleCountdownSec').innerText = idleSecondsLeft;
        } else if (idleSecondsLeft <= 0) {
          closeAdminPanel();
          setDisplay("⏰ 閒置超時，已自動退出管理者模式。", "theme-standby");
        }
      }, 1000);
    }

    document.addEventListener('click', () => { if (isAdminMode) resetAdminIdleTimer(); });
    document.addEventListener('touchstart', () => { if (isAdminMode) resetAdminIdleTimer(); });

    function setDisplay(htmlContent, themeClass) {
      statusDisplay.className = "status-display " + themeClass;
      statusDisplay.innerHTML = htmlContent;
    }

    function playSoundSuccess() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
        osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.start(); osc.stop(ctx.currentTime + 0.4);
      } catch (e) {}
    }

    function playSoundError() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, ctx.currentTime);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        osc.start(); osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    function playSoundAdmin() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.start(); osc.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    }

    async function toggleScan() {
      if (!isScanning) {
        startScan();
      } else {
        stopScan();
      }
    }

    async function startScan() {
      if (!('NDEFReader' in window)) {
        setDisplay("❌ 您的裝置或瀏覽器不支援 Web NFC！<br>請使用 Android Chrome 瀏覽器並開啟 NFC 功能。", "theme-error");
        playSoundError();
        return;
      }
      try {
        nfcReader = new NDEFReader();
        await nfcReader.scan();
        isScanning = true;
        btnScan.innerText = "🛑 停止感應打卡";
        btnScan.classList.add('scanning');
        confirmBox.style.display = 'none';
        
        setDisplay("📡 <b>NFC 感應
