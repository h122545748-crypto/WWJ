<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title><文舞集> 現場簽到系統</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card-container {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    h2 { font-size: 26px; margin-top: 0; color: #ff007f; }
    
    .today-info {
      background: #2a2a2a;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      color: #00d2ff;
      margin-bottom: 15px;
      font-weight: bold;
    }

    /* 動態課程清單開關區塊 */
    .course-section {
      text-align: left;
      margin-bottom: 18px;
    }
    .section-title {
      font-size: 15px;
      color: #aaa;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .course-switch-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 200px;
      overflow-y: auto;
    }
    .course-switch-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #2a2a2a;
      padding: 12px 16px;
      border-radius: 12px;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .course-switch-item.active {
      border-color: #ff007f;
      background: #331525;
    }
    .course-info-text {
      display: flex;
      flex-direction: column;
    }
    .c-name { font-size: 16px; font-weight: bold; color: #fff; }
    .c-teacher { font-size: 13px; color: #ffeb3b; margin-top: 2px; }

    /* 滑動開關 Switch 樣式 */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #555; transition: .3s; border-radius: 24px;
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #ff007f; }
    input:checked + .slider:before { transform: translateX(22px); }

    /* 輸入表單區 */
    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-size: 14px;
      color: #ccc;
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #2c2c2c;
      color: white;
      outline: none;
    }
    .form-control:focus {
      border-color: #00d2ff;
    }

    .btn-submit {
      background: linear-gradient(135deg, #ff007f, #7928ca);
      color: white;
      border: none;
      padding: 16px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
      transition: all 0.2s;
    }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { background: #555; cursor: not-allowed; box-shadow: none; }

    /* 狀態顯示視窗 */
    .status-display {
      margin-top: 15px;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      line-height: 1.5;
      text-align: center;
      display: none;
      word-break: break-all;
    }
    .theme-success { background-color: #004d20; color: #00ff66; border: 2px solid #00ff66; display: block; }
    .theme-error { background-color: #5a0000; color: #ff4d4d; border: 2px solid #ff4d4d; display: block; }
    .theme-loading { background-color: #332b00; color: #ffeb3b; border: 2px solid #ffeb3b; display: block; }
  </style>
</head>
<body>

<div class="card-container">
  <h2>&lt;文舞集&gt; 現場打卡</h2>
  
  <div id="todayInfo" class="today-info">📅 正在載入今日課程...</div>

  <!-- 1. 當日課程選擇區 (獨立滑動開關) -->
  <div class="course-section">
    <div class="section-title">請開啟本次簽到的課程：</div>
    <div id="courseSwitchList" class="course-switch-list">
      <div style="color:#aaa; text-align:center; padding:10px;">讀取中...</div>
    </div>
  </div>

  <!-- 2. 學員姓名輸入 -->
  <div class="input-group">
    <label for="studentName">學員姓名 (免受限預約名單)：</label>
    <input type="text" id="studentName" class="form-control" placeholder="請輸入學員姓名" required>
  </div>

  <button id="submitBtn" class="btn-submit" onclick="submitCheckIn()">確認打卡</button>

  <div id="statusDisplay" class="status-display"></div>
</div>

<script>
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzou8bhecGqckgDOeM0dihDKurQlOQ6CURl2vFeZupA8NcTfMoULBWhLpnhMnurXviX/exec";

  let todayCourses = [];
  let selectedCourseName = "";
  let selectedTeacherName = "";

  document.addEventListener("DOMContentLoaded", () => {
    fetchTodayCourses();
  });

  // 抓取今日課程
  async function fetchTodayCourses() {
    const todayInfoEl = document.getElementById("todayInfo");
    const container = document.getElementById("courseSwitchList");

    try {
      const res = await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: "getTodayCourses" })
      });
      const data = await res.json();

      if (data.status === "success") {
        todayInfoEl.innerText = `📅 今天是 ${data.dayOfWeek}（${data.todayDate}）`;
        todayCourses = data.courses || [];

        if (todayCourses.length === 0) {
          container.innerHTML = `<div style="color:#aaa; text-align:center; padding:10px;">今日暫無安排課程</div>`;
          return;
        }

        renderCourseSwitches(todayCourses);
      } else {
        todayInfoEl.innerText = "⚠️ 載入課程失敗";
        container.innerHTML = `<div style="color:#ff4d4d; text-align:center;">${data.message}</div>`;
      }
    } catch (e) {
      todayInfoEl.innerText = "❌ 連線錯誤";
      container.innerHTML = `<div style="color:#ff4d4d; text-align:center;">網路連線異常，請重新整理</div>`;
    }
  }

  // 渲染獨立滑動開關 (單選邏輯，交由現場人員開啟相對應課程)
  function renderCourseSwitches(courses) {
    const container = document.getElementById("courseSwitchList");
    container.innerHTML = "";

    courses.forEach((c, index) => {
      const itemEl = document.createElement("div");
      itemEl.className = `course-switch-item ${index === 0 ? 'active' : ''}`;
      itemEl.id = `course_item_${index}`;

      itemEl.innerHTML = `
        <div class="course-info-text">
          <span class="c-name">${c.courseName}</span>
          <span class="c-teacher">👤 ${c.teacher} (${c.timeInfo})</span>
        </div>
        <label class="switch">
          <input type="checkbox" name="courseToggle" value="${index}" ${index === 0 ? 'checked' : ''} onchange="handleToggleChange(${index})">
          <span class="slider"></span>
        </label>
      `;
      container.appendChild(itemEl);
    });

    // 預設選擇第一個課程
    if (courses.length > 0) {
      selectedCourseName = courses[0].courseName;
      selectedTeacherName = courses[0].teacher;
    }
  }

  // 切換滑動開關（保持一次僅能選定一堂打卡課程）
  function handleToggleChange(selectedIndex) {
    const inputs = document.querySelectorAll('input[name="courseToggle"]');
    
    inputs.forEach((input, idx) => {
      const itemBox = document.getElementById(`course_item_${idx}`);
      if (idx === selectedIndex) {
        input.checked = true;
        itemBox.classList.add("active");
        selectedCourseName = todayCourses[idx].courseName;
        selectedTeacherName = todayCourses[idx].teacher;
      } else {
        input.checked = false;
        itemBox.classList.remove("active");
      }
    });
  }

  // 提交現場打卡
  async function submitCheckIn() {
    const nameInput = document.getElementById("studentName");
    const studentName = nameInput.value.trim();
    const btn = document.getElementById("submitBtn");

    if (!selectedCourseName) {
      showStatus("請先開啟欲打卡的課程開關！", "theme-error");
      return;
    }

    if (!studentName) {
      showStatus("請輸入學員姓名！", "theme-error");
      return;
    }

    btn.disabled = true;
    showStatus("⏳ 正在登記打卡資料...", "theme-loading");

    try {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          action: "onsiteCheckIn",
          courseName: selectedCourseName,
          teacherName: selectedTeacherName,
          studentName: studentName
        })
      });

      const result = await response.json();

      if (result.status === "success") {
        showStatus(`🎉 打卡成功！<br>課程：<b>${result.courseName}</b><br>學員：<b>${result.studentName}</b><br>日期：${result.date}`, "theme-success");
        nameInput.value = ""; // 清空輸入框方便下一位
      } else {
        showStatus(`❌ 打卡失敗：${result.message}`, "theme-error");
      }
    } catch (e) {
      showStatus("❌ 伺服器連線錯誤，請重試", "theme-error");
    } finally {
      btn.disabled = false;
    }
  }

  function showStatus(htmlMsg, themeClass) {
    const el = document.getElementById("statusDisplay");
    el.className = `status-display ${themeClass}`;
    el.innerHTML = htmlMsg;
  }
</script>

</body>
</html>
