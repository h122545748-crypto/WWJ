<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><文舞集>簽到</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card-container {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      max-width: 500px;
      width: 100%;
      text-align: center;
      position: relative;
    }
    h2 { font-size: 28px; margin-top: 0; color: #ff007f; }
    
    .btn-main {
      background: linear-gradient(135deg, #007bff, #00d2ff);
      color: white;
      border: none;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      border-radius: 16px;
      cursor: pointer;
      width: 100%;
      margin: 15px 0;
      box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
      transition: all 0.2s;
    }
    .btn-main.scanning {
      background: linear-gradient(135deg, #dc3545, #ff6b6b);
      box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
    }

    .status-display {
      margin-top: 15px;
      padding: 25px;
      border-radius: 16px;
      font-size: 22px;
      font-weight: bold;
      line-height: 1.6;
      text-align: left;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      word-break: break-all;
    }

    .theme-standby { background-color: #2a2a2a; color: #aaa; border: 2px dashed #555; text-align: center; }
    
    .theme-waiting {
      background-color: #1a2332;
      color: #00d2ff;
      border: 3px solid #00d2ff;
      animation: breathing-glow 2.5s infinite ease-in-out;
    }

    @keyframes breathing-glow {
      0% { opacity: 0.5; border-color: rgba(0, 210, 255, 0.4); box-shadow: 0 0 5px rgba(0, 210, 255, 0.2); }
      50% { opacity: 1; border-color: rgba(0, 210, 255, 1); box-shadow: 0 0 20px rgba(0, 210, 255, 0.8); }
      100% { opacity: 0.5; border-color: rgba(0, 210, 255, 0.4); box-shadow: 0 0 5px rgba(0, 210, 255, 0.2); }
    }

    .theme-loading {
      background-color: #332b00;
      color: #ffeb3b;
      position: relative;
      border: 4px solid transparent;
      border-image: linear-gradient(90deg, #ffcc00, #332b00, #ffcc00, #332b00) 1;
      animation: marquee-border 1.2s linear infinite;
    }

    @keyframes marquee-border {
      0% { border-image: linear-gradient(0deg, #ffcc00 0%, #332b00 50%, #ffcc00 100%) 1; }
      25% { border-image: linear-gradient(90deg, #ffcc00 0%, #332b00 50%, #ffcc00 100%) 1; }
      50% { border-image: linear-gradient(180deg, #ffcc00 0%, #332b00 50%, #ffcc00 100%) 1; }
      75% { border-image: linear-gradient(270deg, #ffcc00 0%, #332b00 50%, #ffcc00 100%) 1; }
      100% { border-image: linear-gradient(360deg, #ffcc00 0%, #332b00 50%, #ffcc00 100%) 1; }
    }

    .theme-success { background-color: #004d20; color: #00ff66; border: 3px solid #00ff66; }
    .theme-error { background-color: #5a0000; color: #ff4d4d; border: 3px solid #ff4d4d; }
    .theme-admin { background-color: #4a0072; color: #e040fb; border: 3px solid #e040fb; }

    .highlight-val { font-size: 32px; font-weight: 900; color: #ffffff; text-decoration: underline; }

    .warn-alert {
      display: inline-block;
      font-weight: 900;
      color: #ff3333;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
      animation: blink-animation 0.8s infinite alternate;
      background-color: rgba(255, 0, 0, 0.2);
      padding: 2px 8px;
      border-radius: 8px;
    }

    @keyframes blink-animation {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.3; transform: scale(1.02); }
    }

    .history-box {
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 15px;
      color: #e0e0e0;
      font-weight: normal;
    }

    .history-title { font-size: 16px; font-weight: bold; color: #ffeb3b; margin-bottom: 6px; }
    .history-item { padding: 2px 0; font-family: monospace; }

    .confirm-box {
      display: none;
      background: #332b00;
      border: 3px solid #ffcc00;
      padding: 20px;
      border-radius: 16px;
      margin-top: 15px;
      text-align: center;
    }
    .confirm-btn-group { display: flex; gap: 12px; margin-top: 15px; }
    .btn-confirm-yes { flex: 1; background: #28a745; color: white; border: none; padding: 18px; font-size: 22px; font-weight: bold; border-radius: 12px; cursor: pointer; }
    .btn-confirm-no { flex: 1; background: #dc3545; color: white; border: none; padding: 18px; font-size: 22px; font-weight: bold; border-radius: 12px; cursor: pointer; }
    
    .admin-panel {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: #2c2c2c;
      border-radius: 16px;
      border: 2px solid #e040fb;
      text-align: left;
    }
    .admin-panel h3 { color: #e040fb; margin-top: 0; font-size: 22px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 16px; margin-bottom: 5px; color: #ccc; }
    .form-group input, .form-group select {
      width: 100%; padding: 12px; font-size: 18px; border-radius: 8px; border: none; background: #333; color: white;
    }
    .btn-admin-act {
      background: #e040fb; color: white; border: none; padding: 12px; font-size: 18px; font-weight: bold; border-radius: 8px; width: 100%; margin-top: 10px; cursor: pointer;
    }
    .btn-danger { background: #d32f2f !important; }
    .btn-info { background: #0288d1 !important; }
    .btn-warning { background: #f57c00 !important; }
    .btn-close-admin { background: #666; margin-top: 15px; }
    .admin-section { margin-top: 15px; padding-top: 15px; border-top: 1px solid #444; }

    .log-list {
      max-height: 250px;
      overflow-y: auto;
      background: #1e1e1e;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      font-size: 15px;
    }
    .log-item {
      padding: 8px 0;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-refund {
      background: #ff9800; color: white; border: none; padding: 5px 10px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer;
    }

    /* 課程區塊與滑動開關 (Toggle Switch) 樣式 */
    .today-courses-section {
      margin-top: 15px;
      text-align: left;
      background: #252525;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #333;
    }
    .today-title {
      font-size: 16px;
      font-weight: bold;
      color: #00d2ff;
      margin-bottom: 10px;
    }
    .course-switch-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #181818;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid #444;
    }
    .course-info-label {
      font-size: 15px;
      color: #eee;
    }
    .course-info-label small {
      display: block;
      color: #aaa;
      font-size: 12px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #555; transition: .3s; border-radius: 26px;
    }
    .slider:before {
      position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #00d2ff; }
    input:checked + .slider:before { transform: translateX(24px); }

    /* 倒數警訊彈窗 */
    .idle-warning-box {
      display: none;
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 460px;
      background: #d32f2f;
      color: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(255,0,0,0.6);
      z-index: 9999;
      text-align: center;
      font-weight: bold;
      animation: pulse-warn 1s infinite alternate;
    }
    @keyframes pulse-warn {
      0% { transform: translateX(-50%) scale(1); }
      100% { transform: translateX(-50%) scale(1.03); }
    }
  </style>
</head>
<body>

  <div id="idleWarningBox" class="idle-warning-box">
    ⚠️ 檢測到閒置！系統即將於 <span id="idleCountdownSec" style="font-size: 26px; text-decoration: underline;">10</span> 秒後自動退出管理者模式！<br>
    <span style="font-size: 13px; opacity: 0.9;">(請點擊畫面任意處以繼續操作)</span>
  </div>

  <div class="card-container">
    <h2>文舞集 扣點簽到</h2>
    
    <div class="today-courses-section">
      <div id="todayTitle" class="today-title">📅 今日上架課程載入中...</div>
      <div id="todayCoursesList"></div>
    </div>

    <button id="scanBtn" class="btn-main" onclick="toggleNFC(true)" style="display:none;">開啟感應打卡</button>
    
    <div id="statusDisplay" class="status-display theme-standby">
      請現場人員開啟上方上課課程開關以啟動感應打卡...
    </div>

    <div id="confirmBox" class="confirm-box">
      <div id="confirmMsg" style="font-size: 20px; color: #ffeb3b; text-align: left; line-height: 1.5;"></div>
      <div class="confirm-btn-group">
        <button class="btn-confirm-yes" onclick="confirmForceDeduct()">確定扣點</button>
        <button class="btn-confirm-no" onclick="cancelForceDeduct()">取消</button>
      </div>
    </div>

    <div id="adminPanel" class="admin-panel">
      <h3>⚙️ 管理者功能選單</h3>
      
      <div class="admin-section">
        <h4 style="color: #00d2ff; margin: 0 0 10px 0;">💳 開卡 / 補卡</h4>
        <div class="form-group">
          <label>已感應卡號 (Card ID)：</label>
          <input type="text" id="adminCardId" readonly style="background: #444; color: #ffeb3b; font-weight: bold;">
        </div>
        <div class="form-group">
          <label>學員姓名：</label>
          <input type="text" id="adminName" placeholder="請輸入姓名">
        </div>
        <div class="form-group">
          <label>身份類別：</label>
          <select id="adminType">
            <option value="一般學員">一般學員</option>
            <option value="VIP學員">VIP學員</option>
            <option value="管理者">管理者</option>
          </select>
        </div>
        <div class="form-group">
          <label>初始/加購點數：</label>
          <input type="number" id="adminPoints" value="10">
        </div>
        <div class="form-group">
          <label>到期日：</label>
          <input type="date" id="adminExpiry">
        </div>
        <button class="btn-admin-act" onclick="submitAddCard()">確認開卡</button>
        <button class="btn-admin-act btn-warning" onclick="submitAddPoints()">僅儲值點數/更新到期日</button>
        <button class="btn-admin-act btn-danger" onclick="submitDeleteCard()">註銷/刪除此卡片</button>
      </div>

      <div class="admin-section">
        <h4 style="color: #ffeb3b; margin: 0 0 10px 0;">🔄 舊卡資料轉移至新卡</h4>
        <div class="form-group">
          <label>1. 請輸入欲換卡之「學員姓名」搜尋：</label>
          <div style="display:flex; gap:8px;">
            <input type="text" id="searchNameInput" placeholder="輸入姓名關鍵字">
            <button class="btn-admin-act btn-info" style="width:100px; margin-top:0;" onclick="searchUserByName()">搜尋</button>
          </div>
        </div>
        <div id="searchResultsBox" style="display:none; margin-bottom:12px;">
          <label>2. 請選擇要轉移的舊卡記錄：</label>
          <select id="searchResultSelect" onchange="onSelectOldUserCard()"></select>
        </div>
        <div class="form-group">
          <label>當前感應到的「新卡號」：</label>
          <input type="text" id="replaceNewCardId" readonly style="background: #444; color: #00ff66;">
        </div>
        <button class="btn-admin-act btn-warning" onclick="submitReplaceCard()">確定轉移卡號</button>
      </div>

      <div class="admin-section">
        <h4 style="color: #00ff66; margin: 0 0 10px 0;">📜 本月最近打卡紀錄 (可辦理取消簽到退點)</h4>
        <button class="btn-admin-act btn-info" onclick="fetchRecentLogs()">重新整理紀錄</button>
        <div id="recentLogsList" class="log-list"></div>
      </div>

      <button class="btn-admin-act btn-close-admin" onclick="closeAdminPanel()">退出管理者模式</button>
    </div>
  </div>

  <script>
    // ⚠️ 請填入 Apps Script 部署後的 Web App URL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyv59m1vY8AUnu_x-yS2386N_4W4-0Xf1Yd4T2m4Q4L/exec"; // 請替換為您的部署網址

    let nfcReader = null;
    let isScanning = false;
    let pendingConfirmCardId = null;
    let currentSelectedCourse = ""; // 當前被開啟的課程

    // 管理者狀態控制
    let isAdminMode = false;
    let currentScannedCardForAdmin = "";
    let adminIdleTimer = null;
    let adminCountdownInterval = null;
    let idleCountdownSecs = 10;
    const ADMIN_IDLE_LIMIT_MS = 60000; // 60秒無操作自動退出

    const statusDisplay = document.getElementById('statusDisplay');
    const confirmBox = document.getElementById('confirmBox');
    const confirmMsg = document.getElementById('confirmMsg');
    const adminPanel = document.getElementById('adminPanel');
    const idleWarningBox = document.getElementById('idleWarningBox');
    const idleCountdownSecEl = document.getElementById('idleCountdownSec');

    window.onload = function() {
      fetchTodayCourses();
      resetAdminIdleTimer();
    };

    // 監聽全螢幕點擊以重置閒置計時器
    document.addEventListener('click', () => {
      if (isAdminMode) resetAdminIdleTimer();
    });

    // 音效提示
    function playSoundSuccess() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(523.25, ctx.currentTime); 
        osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); 
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    function playSoundError() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, ctx.currentTime);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (e) {}
    }

    // 重置管理者閒置計時器
    function resetAdminIdleTimer() {
      if (!isAdminMode) return;
      if (adminIdleTimer) clearTimeout(adminIdleTimer);
      if (adminCountdownInterval) clearInterval(adminCountdownInterval);
      idleWarningBox.style.display = 'none';

      adminIdleTimer = setTimeout(() => {
        startIdleWarningCountdown();
      }, ADMIN_IDLE_LIMIT_MS - 10000); 
    }

    function startIdleWarningCountdown() {
      idleCountdownSecs = 10;
      idleCountdownSecEl.innerText = idleCountdownSecs;
      idleWarningBox.style.display = 'block';

      adminCountdownInterval = setInterval(() => {
        idleCountdownSecs--;
        idleCountdownSecEl.innerText = idleCountdownSecs;
        if (idleCountdownSecs <= 0) {
          clearInterval(adminCountdownInterval);
          closeAdminPanel();
          setDisplay("⚠️ 檢測到長時間閒置，系統已自動退出管理者模式！", "theme-error");
        }
      }, 1000);
    }

    // 取得當日相對應上架課程
    async function fetchTodayCourses() {
      const result = await safeFetch({ action: "getTodayCourses" });
      const titleEl = document.getElementById("todayTitle");
      const listEl = document.getElementById("todayCoursesList");

      if (result && result.status === "success") {
        titleEl.innerText = `📅 今天是【${result.dayName}】上架課程：`;
        listEl.innerHTML = "";

        if (!result.courses || result.courses.length === 0) {
          listEl.innerHTML = `<div style="color:#aaa; font-size:14px;">今日尚無排定上架課程。</div>`;
          return;
        }

        result.courses.forEach((c, index) => {
          const itemHtml = `
            <div class="course-switch-container">
              <div class="course-info-label">
                <strong>${c.courseName}</strong>
                <small>老師：${c.teacher} | 時間：${c.timeInfo}</small>
              </div>
              <label class="switch">
                <input type="checkbox" class="course-toggle" data-coursename="${c.courseName}" onchange="onCourseToggleChange(this)">
                <span class="slider"></span>
              </label>
            </div>
          `;
          listEl.insertAdjacentHTML('beforeend', itemHtml);
        });
      } else {
        titleEl.innerText = "⚠️ 讀取當日課程失敗，請重新整理頁面。";
      }
    }

    // 處理課程滑動開關（單選邏輯）
    function onCourseToggleChange(selectedToggle) {
      const allToggles = document.querySelectorAll('.course-toggle');

      if (selectedToggle.checked) {
        // 關閉其他所有開關
        allToggles.forEach(t => {
          if (t !== selectedToggle) t.checked = false;
        });

        currentSelectedCourse = selectedToggle.getAttribute('data-coursename');
        toggleNFC(true); // 自動開啟 NFC 感應
      } else {
        // 檢查是否還有任何開關是開啟的
        let hasActive = false;
        allToggles.forEach(t => {
          if (t.checked) {
            hasActive = true;
            currentSelectedCourse = t.getAttribute('data-coursename');
          }
        });

        if (!hasActive) {
          currentSelectedCourse = "";
          toggleNFC(false); // 關閉 NFC 感應
        }
      }
    }

    // 安全 Fetch 包裝
    async function safeFetch(payload) {
      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        return await response.json();
      } catch (err) {
        console.error("Fetch Error:", err);
        return null;
      }
    }

    // 開啟/關閉 NFC 感應
    async function toggleNFC(forceState) {
      if (!("NDEFReader" in window)) {
        setDisplay("❌ 您的裝置或瀏覽器不支援 Web NFC！<br><span style='font-size:16px;'>（請使用 Android Chrome，並開啟 NFC 功用）</span>", "theme-error");
        return;
      }

      if (forceState === true) {
        try {
          nfcReader = new NDEFReader();
          await nfcReader.scan();
          isScanning = true;
          
          setDisplay(`📡 <b>感應打卡中...</b><br>當前選擇課程：<span style="color:#ffeb3b;">${currentSelectedCourse}</span><br><span style="font-size:16px; color:#aaa;">請將 NFC 卡片靠緊手機感應區</span>`, "theme-waiting");

          nfcReader.onreading = (event) => {
            const cardId = event.serialNumber;
            handleCardScanned(cardId);
          };

          nfcReader.onreadingerror = () => {
            playSoundError();
            setDisplay("⚠️ 卡片讀取失敗，請重新再試一次！", "theme-error");
          };

        } catch (error) {
          isScanning = false;
          playSoundError();
          setDisplay("❌ 無法啟動 NFC 感應！<br>請確認手機已開啟 NFC 並授權存取權限。", "theme-error");
        }
      } else {
        isScanning = false;
        setDisplay("請現場人員開啟上方上課課程開關以啟動感應打卡...", "theme-standby");
      }
    }

    // 當卡片被感應到時
    async function handleCardScanned(cardId) {
      confirmBox.style.display = 'none';

      // 若在管理者模式，感應卡號自動填入 adminCardId & replaceNewCardId
      if (isAdminMode) {
        playSoundSuccess();
        currentScannedCardForAdmin = cardId;
        document.getElementById('adminCardId').value = cardId;
        document.getElementById('replaceNewCardId').value = cardId;
        setDisplay(`⚙️ <b>管理者模式</b><br>已讀取到卡號：<span class="highlight-val">${cardId}</span><br>可於下方進行開卡、儲值或換卡動作。`, "theme-admin");
        
        // 自動查詢該卡片目前資料
        const result = await safeFetch({ action: "checkCard", cardId: cardId });
        if (result && result.status === "found") {
          document.getElementById('adminName').value = result.cardData.name;
          document.getElementById('adminType').value = result.cardData.type;
          document.getElementById('adminPoints').value = result.cardData.points;
          document.getElementById('adminExpiry').value = result.cardData.expiry;
        }
        return;
      }

      // 一般學員扣點簽到流程
      setDisplay(`⏳ 正在驗證卡號 ${cardId}...`, "theme-loading");

      const result = await safeFetch({
        action: "deduct",
        cardId: cardId,
        isForce: false,
        courseName: currentSelectedCourse
      });

      if (!result) {
        playSoundError();
        setDisplay("❌ 網路連線失敗，請再試一次！", "theme-error");
        return;
      }

      if (result.status === "admin") {
        playSoundSuccess();
        isAdminMode = true;
        currentScannedCardForAdmin = cardId;
        document.getElementById('adminCardId').value = cardId;
        document.getElementById('replaceNewCardId').value = cardId;
        adminPanel.style.display = 'block';
        resetAdminIdleTimer();
        fetchRecentLogs();
        setDisplay("🔓 <b>解鎖管理者模式！</b><br>請於下方管理面板選擇操作功能。", "theme-admin");

      } else if (result.status === "need_confirm") {
        playSoundError();
        pendingConfirmCardId = cardId;
        confirmMsg.innerHTML = result.message;
        confirmBox.style.display = 'block';
        setDisplay("⚠️ <b>請確認是否要重複扣點打卡？</b>", "theme-loading");

      } else if (result.status === "success") {
        playSoundSuccess();
        let logHtml = "";
        if (result.recentLogs && result.recentLogs.length > 0) {
          logHtml = `<div class="history-box"><div class="history-title">📅 近期 5 次打卡時間：</div>` + 
            result.recentLogs.map(t => `<div class="history-item">🔹 ${t}</div>`).join('') + `</div>`;
        }
        setDisplay(result.message + logHtml, "theme-success");

      } else {
        playSoundError();
        setDisplay(`❌ <b>打卡失敗！</b><br>${result.message}`, "theme-error");
      }
    }

    // 強制二次確認扣點
    async function confirmForceDeduct() {
      confirmBox.style.display = 'none';
      if (!pendingConfirmCardId) return;

      setDisplay(`⏳ 正在強制辦理扣點...`, "theme-loading");

      const result = await safeFetch({
        action: "deduct",
        cardId: pendingConfirmCardId,
        isForce: true,
        courseName: currentSelectedCourse
      });

      pendingConfirmCardId = null;

      if (result && result.status === "success") {
        playSoundSuccess();
        let logHtml = "";
        if (result.recentLogs && result.recentLogs.length > 0) {
          logHtml = `<div class="history-box"><div class="history-title">📅 近期 5 次打卡時間：</div>` + 
            result.recentLogs.map(t => `<div class="history-item">🔹 ${t}</div>`).join('') + `</div>`;
        }
        setDisplay(result.message + logHtml, "theme-success");
      } else {
        playSoundError();
        setDisplay(`❌ <b>打卡失敗！</b><br>${result ? result.message : '連線錯誤'}`, "theme-error");
      }
    }

    function cancelForceDeduct() {
      confirmBox.style.display = 'none';
      pendingConfirmCardId = null;
      setDisplay("已取消重複打卡操作。", "theme-standby");
    }

    // ------------------------------------
    // 管理者操作函式
    // ------------------------------------
    async function submitAddCard() {
      const cardId = document.getElementById('adminCardId').value;
      const name = document.getElementById('adminName').value.trim();
      const cardType = document.getElementById('adminType').value;
      const points = document.getElementById('adminPoints').value;
      const expiryDate = document.getElementById('adminExpiry').value;

      if (!cardId || !name) {
        alert("請先感應卡片並輸入學員姓名！");
        return;
      }

      setDisplay("⏳ 正在開卡中...", "theme-loading");
      const result = await safeFetch({
        action: "addCard",
        cardId, name, cardType, points, expiryDate
      });

      if (result && result.status === "success") {
        playSoundSuccess();
        alert(result.message);
        setDisplay(`🎉 <b>開卡成功！</b><br>學員：<b>${name}</b><br>卡號：${cardId}<br>初始點數：<b>${points}</b> 點`, "theme-admin");
      } else {
        playSoundError();
        alert(result ? result.message : "開卡失敗");
      }
    }

    async function submitAddPoints() {
      const cardId = document.getElementById('adminCardId').value;
      const addPointsAmount = document.getElementById('adminPoints').value;
      const expiryDate = document.getElementById('adminExpiry').value;

      if (!cardId) {
        alert("請先感應卡片！");
        return;
      }

      setDisplay("⏳ 正在辦理點數儲值...", "theme-loading");
      const result = await safeFetch({
        action: "addPoints",
        cardId, addPointsAmount, expiryDate
      });

      if (result && result.status === "success") {
        playSoundSuccess();
        alert(result.message);
        setDisplay(`🎉 <b>儲值成功！</b><br>${result.message}`, "theme-admin");
      } else {
        playSoundError();
        alert(result ? result.message : "儲值失敗");
      }
    }

    async function submitDeleteCard() {
      const cardId = document.getElementById('adminCardId').value;
      if (!cardId) return alert("請先感應卡片！");
      if (!confirm(`確定要註銷/刪除卡號 ${cardId} 嗎？此操作不可逆！`)) return;

      setDisplay("⏳ 正在辦理卡片註銷...", "theme-loading");
      const result = await safeFetch({ action: "deleteCard", cardId });

      if (result && result.status === "success") {
        playSoundSuccess();
        alert(result.message);
        document.getElementById('adminCardId').value = "";
        document.getElementById('adminName').value = "";
        setDisplay(`🗑️ <b>已註銷卡片！</b><br>卡號：${cardId}`, "theme-admin");
      } else {
        playSoundError();
        alert(result ? result.message : "註銷失敗");
      }
    }

    async function searchUserByName() {
      const name = document.getElementById('searchNameInput').value.trim();
      if (!name) return alert("請輸入姓名關鍵字！");

      const result = await safeFetch({ action: "searchUserByName", name: name });
      const box = document.getElementById('searchResultsBox');
      const select = document.getElementById('searchResultSelect');

      if (result && result.status === "success" && result.results.length > 0) {
        select.innerHTML = '<option value="">-- 請選擇學員舊卡 --</option>';
        result.results.forEach(u => {
          select.innerHTML += `<option value="${u.cardId}" data-name="${u.name}">${u.name} (卡號:${u.cardId} | 剩:${u.points}點)</option>`;
        });
        box.style.display = 'block';
      } else {
        alert("查無相關學員資料！");
        box.style.display = 'none';
      }
    }

    function onSelectOldUserCard() {
      const select = document.getElementById('searchResultSelect');
      const oldCardId = select.value;
      if (oldCardId) {
        const opt = select.options[select.selectedIndex];
        console.log("已選擇舊卡卡號:", oldCardId, "姓名:", opt.getAttribute('data-name'));
      }
    }

    async function submitReplaceCard() {
      const select = document.getElementById('searchResultSelect');
      const oldCardId = select.value;
      const newCardId = document.getElementById('replaceNewCardId').value;

      if (!oldCardId) return alert("請先搜尋並選擇要轉移的舊卡！");
      if (!newCardId) return alert("請將「新卡」靠緊手機感應區以獲取新卡號！");
      if (oldCardId === newCardId) return alert("舊卡號與新卡號相同，無需轉移！");

      const name = select.options[select.selectedIndex].getAttribute('data-name');
      if (!confirm(`確定要將學員【${name}】的卡號由 ${oldCardId} 轉移至 ${newCardId} 嗎？`)) return;

      setDisplay("⏳ 正在轉移卡號資料...", "theme-loading");
      const result = await safeFetch({
        action: "replaceCard",
        oldCardId: oldCardId,
        newCardId: newCardId,
        name: name
      });

      if (result && result.status === "success") {
        playSoundSuccess();
        alert(result.message);
        setDisplay(`🎉 <b>卡號轉移成功！</b><br>學員：<b>${name}</b><br>新卡號：<b>${newCardId}</b>`, "theme-admin");
        document.getElementById('searchResultsBox').style.display = 'none';
      } else {
        playSoundError();
        alert(result ? result.message : "轉移失敗");
      }
    }

    async function fetchRecentLogs() {
      const listEl = document.getElementById('recentLogsList');
      listEl.innerHTML = "載入中...";

      const result = await safeFetch({ action: "getRecentLogs" });
      if (result && result.status === "success" && result.logs) {
        listEl.innerHTML = "";
        if (result.logs.length === 0) {
          listEl.innerHTML = "尚無記錄";
          return;
        }
        result.logs.forEach(log => {
          const item = document.createElement('div');
          item.className = 'log-item';
          item.innerHTML = `
            <div>
              <b>${log.name}</b> (${log.cardId})<br>
              <small style="color:#aaa;">${log.time} | ${log.note}</small>
            </div>
            ${log.note.includes('扣點') ? `<button class="btn-refund" onclick="cancelCheckIn('${log.cardId}', '${log.name}', '${log.time}')">退點</button>` : ''}
          `;
          listEl.appendChild(item);
        });
      } else {
        listEl.innerHTML = "載入失敗";
      }
    }

    // 執行取消簽到並退點
    async function cancelCheckIn(cardId, name, logTimeStr) {
      if (!confirm(`確定要幫學員【${name}】取消於 ${logTimeStr} 的簽到，並退回 1 點嗎？`)) return;

      setDisplay("⏳ 正在辦理取消簽到退點...", "theme-loading");

      const result = await safeFetch({
        action: "cancelCheckIn",
        cardId: cardId,
        name: name,
        logTimeStr: logTimeStr
      });

      if (result && result.status === "success") {
        playSoundSuccess();
        alert(result.message);
        fetchRecentLogs(); 
        setDisplay(`🎉 <b>已成功取消簽到！</b><br>學員：<b>${name}</b><br>已退回 1 點，目前剩餘：<b>${result.newPoints}</b> 點。`, "theme-admin");
      } else {
        playSoundError();
        alert(result ? result.message : "取消簽到失敗");
      }
    }

    function closeAdminPanel() {
      isAdminMode = false;
      currentScannedCardForAdmin = "";
      
      if (adminIdleTimer) clearTimeout(adminIdleTimer);
      if (adminCountdownInterval) clearInterval(adminCountdownInterval);
      idleWarningBox.style.display = 'none';

      adminPanel.style.display = 'none';

      if (currentSelectedCourse) {
        toggleNFC(true);
      } else {
        setDisplay("請現場人員開啟上方上課課程開關以啟動感應打卡...", "theme-standby");
      }
    }
  </script>
</body>
</html>
